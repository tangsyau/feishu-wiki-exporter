[package]
name = "feishu-wiki-reader"
version = "0.1.2"
description = "Offline reader for Feishu Wiki Exporter knowledge packages"
authors = ["Feishu Wiki Exporter contributors"]
license = "Apache-2.0"
repository = "https://github.com/tangsyau/feishu-wiki-exporter"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
