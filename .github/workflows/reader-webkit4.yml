name: Reader WebKitGTK 4.0 Compatibility

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }} / Tauri 1 / WebKitGTK 4.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            machine: x86_64
            deb_arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
            machine: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.os }}
    container:
      image: debian:buster
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Prepare Debian 10 archive repositories
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git libappindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.0-dev patchelf rpm wget xdg-utils

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            knowledge-reader/package-lock.json
            knowledge-reader/legacy-tauri-v1/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate project version
        id: version
        shell: bash
        run: |
          node scripts/check-version.mjs
          version="$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate application icons
        run: python3 scripts/check-icons.py

      - name: Install reader dependencies
        working-directory: knowledge-reader
        run: npm ci

      - name: Install Tauri 1 compatibility CLI
        working-directory: knowledge-reader/legacy-tauri-v1
        run: npm ci

      - name: Build WebKitGTK 4.0 compatibility packages
        working-directory: knowledge-reader/legacy-tauri-v1
        run: npm run tauri -- build --bundles appimage,deb

      - name: Patch AppImage for system Wayland and Maleoon
        shell: bash
        run: |
          set -euo pipefail
          appimage_file="$(find knowledge-reader/legacy-tauri-v1/src-tauri/target/release/bundle/appimage \
            -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage_file"
          bash scripts/patch-reader-webkit4-appimage.sh \
            "$appimage_file" \
            '${{ matrix.machine }}'

      - name: Verify WebKit and glibc compatibility
        shell: bash
        working-directory: knowledge-reader/legacy-tauri-v1
        run: |
          bash ../../scripts/verify-reader-webkit4.sh \
            '${{ matrix.machine }}' \
            '${{ matrix.deb_arch }}' \
            src-tauri/target/release 2>&1 | tee webkit4-verification.txt

      - name: Upload failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: feishu-wiki-reader-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}-webkitgtk4.0-unverified-diagnostics
          path: |
            knowledge-reader/legacy-tauri-v1/webkit4-verification.txt
            knowledge-reader/legacy-tauri-v1/src-tauri/target/release/bundle/deb/*.deb
            knowledge-reader/legacy-tauri-v1/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload WebKitGTK 4.0 AppImage
        uses: actions/upload-artifact@v7
        with:
          name: feishu-wiki-reader-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}-webkitgtk4.0-appimage
          path: knowledge-reader/legacy-tauri-v1/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
